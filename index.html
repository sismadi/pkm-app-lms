<script type="text/javascript">

function renderMenu() {
    const navLinks = document.getElementById('navLinks');
    if (!navLinks) return;

    const pageLinks = Object.keys(pages).map(key => {
        const label = key.charAt(0).toUpperCase() + key.slice(1);
        return `<a href="/?${key}" onclick="return web.navigate('${key}')">${label}</a>`;
    }).join('\n');

    // Tautan tetap untuk fitur dashboard (di luar pages.*, resolver berbasis rute)
    const extraLinks =
        `<a href="/?stats" onclick="return web.navigate('stats')">Statistik</a>` +
        `<a href="/?dashboard" onclick="return web.navigate('dashboard')">Dashboard</a>`;

    navLinks.innerHTML = pageLinks + extraLinks;

    if (typeof auth !== 'undefined') auth.renderAuthUI();
}

</script>

<script src="pages/index.js"></script>  <!-- manifest -->
<script src="dataset.js"></script>
<script>
    loadPageScripts(pageFiles, () => {
        renderMenu();
